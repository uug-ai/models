name: Create a new release
on:
  release:
    types: [created]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      docker_context: "."
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]
      create_gitops_pr: false
    secrets: inherit

  publish-npm:
    runs-on: ubuntu-24.04
    needs: [release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NODE_REGISTRY_URL }}
          
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest  
          
      - name: Install dependencies
        working-directory: ./src/typescript
        run: npm ci
             
      - name: Generate openapi
        run: npm run generate:openapi

      - name: Generate types
        run: npm run generate:types

      - name: Build TypeScript
        run: npm run build
        
      - name: Update package version
        working-directory: ./src/typescript
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          echo "Setting version from release tag: $RELEASE_VERSION"
          npm version "$RELEASE_VERSION" --no-git-tag-version
          
      - name: Authenticate with NPM
        working-directory: ./src/typescript
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_ACCESS_TOKEN }}" > .npmrc

      - name: Publish to NPM
        working-directory: ./src/typescript
        run: npm publish