name: Create a new release
on:
  release:
    types: [created]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      docker_context: "."
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]
      create_gitops_pr: false
    secrets: inherit

  # npm trusted publishing only accepts runs started by npm-publish.yml
  # itself, so start it as its own run instead of publishing from this one.
  publish-npm:
    runs-on: ubuntu-24.04
    needs: [release]
    permissions:
      actions: write
    steps:
      - name: Start "Publish npm package"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run npm-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f tag="$TAG"
          echo "Started npm publish for $TAG: https://github.com/$GITHUB_REPOSITORY/actions/workflows/npm-publish.yml" >> "$GITHUB_STEP_SUMMARY"
