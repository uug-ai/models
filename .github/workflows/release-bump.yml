name: Bump release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

jobs:
  # Determine the next version and create the GitHub release with generated notes.
  bump-release:
    uses: uug-ai/workflows/.github/workflows/release-bump.yml@main
    with:
      bump: ${{ github.event.inputs.bump }}
    secrets: inherit

  # Run the repository's release pipeline for the freshly created tag.
  # A release created with the default GITHUB_TOKEN does not emit the
  # `release: created` event, so we invoke the reusable workflow directly.
  release:
    needs: bump-release
    uses: ./.github/workflows/release-create.yml
    with:
      tag: ${{ needs.bump-release.outputs.tag }}
    secrets: inherit