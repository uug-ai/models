name: Bump release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  # Determine the next version, create the GitHub release and expose the tag.
  bump-release:
    uses: uug-ai/workflows/.github/workflows/release-bump.yml@main
    with:
      bump: ${{ github.event.inputs.bump }}
    secrets: inherit

  # Run the original release pipeline for the freshly created tag.
  # A release created with the default GITHUB_TOKEN does not emit the
  # `release: created` event, so we invoke the reusable workflow directly.
  release:
    needs: bump-release
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      organization: uug-ai
      project: ${{ github.event.repository.name }}
      tag: ${{ needs.bump-release.outputs.tag }}
      docker_context: "."
      create_gitops_pr: false
      runner_matrix: >-
        [
          {"architecture":"amd64","runner":"ubuntu-24.04"},
          {"architecture":"arm64","runner":"ubuntu-24.04-arm"}
        ]
    secrets: inherit

  publish-npm:
    runs-on: ubuntu-24.04
    needs: [bump-release, release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NODE_REGISTRY_URL }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Install dependencies
        working-directory: ./src/typescript
        run: npm ci

      - name: Generate openapi
        run: npm run generate:openapi

      - name: Generate types
        run: npm run generate:types

      - name: Build TypeScript
        run: npm run build

      - name: Update package version
        working-directory: ./src/typescript
        env:
          RELEASE_TAG: ${{ needs.bump-release.outputs.tag }}
        run: |
          RELEASE_VERSION=${RELEASE_TAG#v}
          echo "Setting version from release tag: $RELEASE_VERSION"
          npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Authenticate with NPM
        working-directory: ./src/typescript
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_ACCESS_TOKEN }}" > .npmrc

      - name: Publish to NPM
        working-directory: ./src/typescript
        run: npm publish